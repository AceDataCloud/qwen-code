name: Native extension secret platform verification
on:
  push:
    branches: [codex/verify-native-secret-platform]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Native SecretStorage (${{ matrix.os }}, Node22)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout validation-only branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup Node22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Install frozen dependencies with normal native scripts
        shell: bash
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Compile owning core package and browser prerequisite
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm run build --workspace=@qwen-code/qwen-code-core
      - name: Focused load and workspace-alias regressions
        if: runner.os == 'Linux'
        shell: bash
        working-directory: packages/core
        env:
          CI: 'true'
        run: |
          ../../node_modules/.bin/vitest run src/extension/extensionManager.test.ts src/extension/extensionSettings.test.ts --coverage.enabled=false 
      - name: Verify real selected SecretStorage to localhost Header
        shell: bash
        env:
          NATIVE_SOURCE_HEAD: 25a19a4ed7431c56abbc27bf67911a46a574f4c6
          CI: 'true'
        run: node scripts/native-secret-platform.mjs
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-secret-${{ matrix.os }}
          path: native-secret-platform-result.json
          if-no-files-found: warn
