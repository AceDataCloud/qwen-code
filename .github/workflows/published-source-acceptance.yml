name: Published Qwen source install acceptance
on:
  push:
    branches: [codex/verify-published-native-source]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install pexpect
      - name: Download and verify official stable CLI
        run: |
          curl -fL --retry 2 https://github.com/QwenLM/qwen-code/releases/download/v0.25.2/qwen-code-linux-x64.tar.gz -o qwen-cli.tar.gz
          echo '24f5c5c9b56f0ac0abfdb0d4b2c5831f0e4ac8b0928b8e5e4fa445a705aee61b  qwen-cli.tar.gz' | sha256sum -c -
          mkdir qwen-release
          tar -xzf qwen-cli.tar.gz -C qwen-release --strip-components=1
          qwen-release/bin/qwen --version
      - name: Add published source, discover brands and install five remote archives
        run: python scripts/check-published-source.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-source-acceptance
          path: published-discover-install-result.json
          if-no-files-found: warn
